name: build
on: [workflow_dispatch]
jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl pyinstaller
      - run: pyinstaller --onefile --name AvitoCompare compare.py
      - uses: actions/upload-artifact@v4
        with:
          name: AvitoCompare-macOS
          path: dist/AvitoCompare
